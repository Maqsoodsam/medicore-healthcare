openapi: 3.0.3

info:
  title: MediCore API
  description: RESTful API contract for the MediCore healthcare platform.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Patients
    description: Patient management operations
  - name: Doctors
    description: Doctor management operations
  - name: Appointments
    description: Appointment management operations

paths:

  /patients:
    get:
      tags:
        - Patients
      summary: Retrieve all patients
      description: Retrieve a list of all registered patients.
      responses:
        '200':
          description: Patients retrieved successfully.
          content:
            application/json:
              example:
                - id: 1
                  firstName: John
                  lastName: Smith
                  dateOfBirth: "1985-05-15"
                  email: john.smith@example.com
                  phone: "+61-400-123-456"
                - id: 2
                  firstName: Jane
                  lastName: Doe
                  dateOfBirth: "1990-08-20"
                  email: jane.doe@example.com
                  phone: "+61-400-654-321"
        '400':
          description: Bad request.

    post:
      tags:
        - Patients
      summary: Register a new patient
      description: Register a new patient in the MediCore system.
      requestBody:
        required: true
        content:
          application/json:
            example:
              firstName: John
              lastName: Smith
              dateOfBirth: "1985-05-15"
              email: john.smith@example.com
              phone: "+61-400-123-456"
      responses:
        '201':
          description: Patient registered successfully.
          content:
            application/json:
              example:
                id: 1
                firstName: John
                lastName: Smith
                dateOfBirth: "1985-05-15"
                email: john.smith@example.com
                phone: "+61-400-123-456"
        '400':
          description: Invalid patient data.

  /doctors:
    get:
      tags:
        - Doctors
      summary: Retrieve all doctors
      description: Retrieve a list of all registered doctors.
      responses:
        '200':
          description: Doctors retrieved successfully.
          content:
            application/json:
              example:
                - id: 1
                  firstName: Sarah
                  lastName: Wilson
                  specialty: Cardiology
                  email: sarah.wilson@medicore.com
                - id: 2
                  firstName: Michael
                  lastName: Brown
                  specialty: General Practice
                  email: michael.brown@medicore.com
        '400':
          description: Bad request.

    post:
      tags:
        - Doctors
      summary: Register a new doctor
      description: Register a new doctor in the MediCore system.
      requestBody:
        required: true
        content:
          application/json:
            example:
              firstName: Sarah
              lastName: Wilson
              specialty: Cardiology
              email: sarah.wilson@medicore.com
      responses:
        '201':
          description: Doctor registered successfully.
          content:
            application/json:
              example:
                id: 1
                firstName: Sarah
                lastName: Wilson
                specialty: Cardiology
                email: sarah.wilson@medicore.com
        '400':
          description: Invalid doctor data.

  /appointments:
    get:
      tags:
        - Appointments
      summary: Retrieve all appointments
      description: Retrieve all appointments registered in the MediCore system.
      responses:
        '200':
          description: Appointments retrieved successfully.
          content:
            application/json:
              example:
                - id: 1
                  patientId: 1
                  doctorId: 1
                  appointmentDate: "2026-09-01"
                  appointmentTime: "10:00:00"
                  status: Scheduled
                - id: 2
                  patientId: 2
                  doctorId: 2
                  appointmentDate: "2026-09-02"
                  appointmentTime: "14:30:00"
                  status: Scheduled
        '400':
          description: Bad request.

    post:
      tags:
        - Appointments
      summary: Create a new appointment
      description: Create a new appointment between a patient and a doctor.
      requestBody:
        required: true
        content:
          application/json:
            example:
              patientId: 1
              doctorId: 1
              appointmentDate: "2026-09-01"
              appointmentTime: "10:00:00"
      responses:
        '201':
          description: Appointment created successfully.
          content:
            application/json:
              example:
                id: 1
                patientId: 1
                doctorId: 1
                appointmentDate: "2026-09-01"
                appointmentTime: "10:00:00"
                status: Scheduled
        '400':
          description: Invalid appointment data.
        '404':
          description: Patient or doctor not found.

  /appointments/{id}:
    put:
      tags:
        - Appointments
      summary: Update an existing appointment
      description: Update the details of an existing appointment.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the appointment.
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              patientId: 1
              doctorId: 1
              appointmentDate: "2026-09-01"
              appointmentTime: "11:00:00"
              status: Scheduled
      responses:
        '200':
          description: Appointment updated successfully.
          content:
            application/json:
              example:
                id: 1
                patientId: 1
                doctorId: 1
                appointmentDate: "2026-09-01"
                appointmentTime: "11:00:00"
                status: Scheduled
        '400':
          description: Invalid appointment data.
        '404':
          description: Appointment not found.

    delete:
      tags:
        - Appointments
      summary: Cancel an appointment
      description: Cancel an existing appointment.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the appointment.
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Appointment cancelled successfully.
          content:
            application/json:
              example:
                message: Appointment cancelled successfully.
                appointmentId: 1
        '404':
          description: Appointment not found.

components:
  schemas:

    Patient:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Smith
        dateOfBirth:
          type: string
          format: date
          example: "1985-05-15"
        email:
          type: string
          format: email
          example: john.smith@example.com
        phone:
          type: string
          example: "+61-400-123-456"

    Doctor:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          example: Sarah
        lastName:
          type: string
          example: Wilson
        specialty:
          type: string
          example: Cardiology
        email:
          type: string
          format: email
          example: sarah.wilson@medicore.com

    Appointment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        patientId:
          type: integer
          format: int64
          example: 1
        doctorId:
          type: integer
          format: int64
          example: 1
        appointmentDate:
          type: string
          format: date
          example: "2026-09-01"
        appointmentTime:
          type: string
          format: time
          example: "10:00:00"
        status:
          type: string
          example: Scheduled
